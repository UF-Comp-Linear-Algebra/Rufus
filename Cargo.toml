[package]
name = "rufus"

version = "1.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
camino = "1.1.9"
clap = { version = "4.5.23", features = ["cargo", "derive"] }
colored = "3.0.0"
itertools = "0.14.0"
rayon = "1.10.0"
regex = "1.11.1"
serde = { version = "1.0.216", features = ["derive"] }
serde_yaml = "0.9.34"
walkdir = "2.5.0"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
